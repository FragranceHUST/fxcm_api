<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FXCM 盯盘</title>
<style>
  :root {
    --bg: #131722; --panel: #1e222d; --border: #2a2e39;
    --text: #d1d4dc; --muted: #787b86;
    --up: #26a69a; --down: #ef5350; --accent: #2962ff;
  }
  body.demo-env { --accent: #2962ff; }
  body.real-env { --accent: #ff5252; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .brand { font-weight: 600; font-size: 15px; }
  .env-switch { display: flex; gap: 6px; }
  .env-btn { padding: 5px 16px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; color: var(--muted); font-weight: 600; user-select: none; }
  .env-btn.active-demo { background: #2962ff; color: #fff; border-color: #2962ff; }
  .env-btn.active-real { background: #ff5252; color: #fff; border-color: #ff5252; }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .status.ok { color: var(--up); }
  .status.bad { color: var(--down); }
  #env-banner { padding: 6px 16px; font-size: 13px; font-weight: 600; display: none; }
  body.demo-env #env-banner { display: block; background: rgba(41, 98, 255, 0.15); color: #7aa2ff; }
  body.real-env #env-banner { display: block; background: rgba(255, 82, 82, 0.18); color: #ff8a8a; }
  nav { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 5px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; }
  .quote { margin-left: auto; font-variant-numeric: tabular-nums; display: flex; gap: 14px; align-items: baseline; }
  .quote .bid, .quote .ask { font-size: 18px; font-weight: 600; }
  .quote .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .quote .spread { color: var(--muted); font-size: 12px; }
  #chart { height: calc(100vh - 320px); min-height: 320px; }
  #panel { border-top: 1px solid var(--border); padding: 10px 16px; }
  .acct-row { display: flex; gap: 24px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .acct-row .label { color: var(--muted); font-size: 12px; margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  .pos-buy { color: var(--up); } .pos-sell { color: var(--down); }
  footer { padding: 6px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .ticket { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  .t-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  .t-row .label { color: var(--muted); font-size: 12px; }
  .t-row input, .t-row select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; width: 90px; }
  .t-row button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 18px; cursor: pointer; font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; }
  .hint.warn { color: #e6b800; }
  .rowbtn { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  .rowbtn:hover { border-color: var(--accent); color: var(--accent); }
  .stats-row { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0; }
  .stat-card { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 110px; }
  .stat-card .k { color: var(--muted); font-size: 11px; }
  .stat-card .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="demo-env">
<header>
  <div class="brand">FXCM 盯盘</div>
  <div class="env-switch">
    <div id="btn-demo" class="env-btn active-demo" onclick="switchEnv('demo')">模拟 DEMO</div>
    <div id="btn-real" class="env-btn" onclick="switchEnv('real')">真实 REAL</div>
  </div>
  <div id="status" class="status">连接中…</div>
</header>
<div id="env-banner">🧪 模拟环境（demo 账户）</div>
<nav>
  <div id="symbol-tabs" class="tabs"></div>
  <div id="tf-tabs" class="tabs"></div>
  <div id="quote" class="quote"></div>
</nav>
<div id="chart"></div>
<div id="panel">
  <div class="acct-row" id="acct-row"></div>
  <div class="ticket">
    <div class="t-row">
      <span class="label">品种</span><b id="t-symbol">XAU/USD</b>
      <span class="label">类型</span>
      <select id="t-type">
        <option value="market">市价</option>
        <option value="limit">限价</option>
        <option value="stop">止损突破</option>
      </select>
      <span class="label">方向</span>
      <select id="t-side"><option value="buy">买入</option><option value="sell">卖出</option></select>
    </div>
    <div class="t-row">
      <span class="label">手数</span><input id="t-amount" type="number" value="10">
      <span class="label">触发价</span><input id="t-rate" type="number" disabled placeholder="市价免填">
      <span class="label">band(pips)</span><input id="t-band" type="number" value="10">
      <span class="label">SL(pips)</span><input id="t-sl" type="number" placeholder="可选" oninput="updateSlHint()"><span class="hint" id="t-sl-hint"></span>
      <span class="label">TP(价)</span><input id="t-tp" type="number" placeholder="可选" oninput="updateTpHint()"><span class="hint" id="t-tp-hint"></span>
      <button onclick="submitOrder()">下单</button>
    </div>
    <div class="t-row"><span class="hint" id="t-hint"></span></div>
  </div>
  <table>
    <thead><tr>
      <th>trade_id</th><th>品种</th><th>方向</th><th>手数</th>
      <th>开仓价</th><th>当前止损</th><th>止损单ID</th><th>浮动盈亏</th><th>操作</th>
    </tr></thead>
    <tbody id="pos-body"><tr><td colspan="9" style="color:var(--muted)">加载中…</td></tr></tbody>
  </table>
  <div style="margin-top:8px" class="hint">挂单 / 触发器</div>
  <table>
    <thead><tr><th>ID</th><th>类型</th><th>品种</th><th>方向</th><th>价格</th><th>手数</th><th>说明</th><th>操作</th></tr></thead>
    <tbody id="pend-body"><tr><td colspan="8" style="color:var(--muted)">无</td></tr></tbody>
  </table>
  <div style="margin-top:8px" class="hint">交易统计（CostFunction 口径）</div>
  <div class="stats-row" id="stats-row"></div>
  <div style="margin-top:8px" class="hint">已平仓交易（最近 20 笔）</div>
  <table>
    <thead><tr><th>trade_id</th><th>品种</th><th>方向</th><th>开仓价</th><th>平仓价</th><th>盈亏</th><th>平仓时间</th></tr></thead>
    <tbody id="closed-body"><tr><td colspan="7" style="color:var(--muted)">加载中…</td></tr></tbody>
  </table>
</div>
<footer id="csv-note"></footer>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
const SYMBOLS = ["XAU/USD", "USD/JPY", "EUR/USD"];
const TFS = { "1m": 60, "15m": 900, "1h": 3600, "4h": 14400 };
const DIGITS = { "XAU/USD": 2, "USD/JPY": 3, "EUR/USD": 5 };
const TZ_OFFSET_H = -new Date().getTimezoneOffset() / 60;

let activeSymbol = SYMBOLS[0];
let activeTf = "1m";
let activeEnv = "demo";
let series = null;
let lastBar = null;
let ws = null;
let constraintsData = null;
let tradePriceLines = [];

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  layout: { background: { color: "var(--bg)" }, textColor: "#787b86" },
  grid: { vertLines: { color: "#1c2030" }, horzLines: { color: "#1c2030" } },
  timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6 },
  priceScale: { borderColor: "#2a2e39" },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});

function makeSeries() {
  if (series) chart.removeSeries(series);
  const digits = DIGITS[activeSymbol] ?? 5;
  series = chart.addCandlestickSeries({
    upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
    wickUpColor: "#26a69a", wickDownColor: "#ef5350",
    priceFormat: { type: "price", precision: digits, minMove: Math.pow(10, -digits) },
  });
  tradePriceLines = [];
  series.setMarkers([]);
}

function updateTradeOverlays(positions) {
  if (!series) return;
  tradePriceLines.forEach(pl => series.removePriceLine(pl));
  tradePriceLines = [];
  const mine = (positions || []).filter(p => p.symbol === activeSymbol);
  const digits = DIGITS[activeSymbol] ?? 5;
  const markers = [];
  mine.forEach(p => {
    // canvas 绘制不解析 CSS 变量，颜色用与涨跌色一致的具体色值
    const color = p.is_buy ? "#26a69a" : "#ef5350";
    const side = p.is_buy ? "买" : "卖";
    if (p.open_time) {
      markers.push({
        time: Math.floor(p.open_time) + TZ_OFFSET_H * 3600,
        position: p.is_buy ? "belowBar" : "aboveBar",
        shape: p.is_buy ? "arrowUp" : "arrowDown",
        color: color,
        text: `${side} ${p.amount} @${p.open_rate.toFixed(digits)}`,
      });
    }
    tradePriceLines.push(series.createPriceLine({
      price: p.open_rate,
      color: color,
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true,
      title: `#${p.trade_id} ${side} ${p.amount}`,
    }));
  });
  markers.sort((a, b) => a.time - b.time);
  series.setMarkers(markers);
}

async function loadCandles() {
  makeSeries();
  lastBar = null;
  const resp = await fetch(`/api/candles?symbol=${encodeURIComponent(activeSymbol)}&tf=${activeTf}&limit=800`);
  if (!resp.ok) { document.getElementById("status").textContent = "K线加载失败"; return; }
  const bars = await resp.json();
  const data = bars.map(b => ({
    time: Math.floor(b.ts) + TZ_OFFSET_H * 3600,
    open: b.open, high: b.high, low: b.low, close: b.close,
  }));
  if (data.length) lastBar = { ...data[data.length - 1] };
  series.setData(data);
}

let lastQuote = null;   // {bid, ask} of activeSymbol

function renderQuote(q) {
  if (!q) return;
  lastQuote = q;
  const digits = DIGITS[activeSymbol] ?? 5;
  const spread = (q.ask - q.bid).toFixed(digits);
  document.getElementById("quote").innerHTML =
    `<span><span class="label">买</span><span class="bid" style="color:var(--down)">${q.bid.toFixed(digits)}</span></span>` +
    `<span><span class="label">卖</span><span class="ask" style="color:var(--up)">${q.ask.toFixed(digits)}</span></span>` +
    `<span class="spread">点差 ${spread}</span>`;
}

async function submitOrder() {
  const env = activeEnv;
  const type = document.getElementById("t-type").value;
  const isBuy = document.getElementById("t-side").value === "buy";
  const amount = parseInt(document.getElementById("t-amount").value, 10);
  const body = { order_type: type, symbol: activeSymbol, is_buy: isBuy, amount };
  if (type !== "market") {
    body.rate = parseFloat(document.getElementById("t-rate").value);
    body.band_pips = parseFloat(document.getElementById("t-band").value) || 10;
    if (!body.rate) { alert("请填写触发价"); return; }
  }
  const sl = parseFloat(document.getElementById("t-sl").value);
  if (sl) body.sl_pips = sl;
  const tp = parseFloat(document.getElementById("t-tp").value);
  if (tp) {
    body.tp_price = tp;
    if (constraintsData && constraintsData.price) {
      const wrong = isBuy ? tp <= constraintsData.price : tp >= constraintsData.price;
      if (wrong) { alert("止盈价方向错误：多头止盈须高于现价，空头止盈须低于现价"); return; }
    }
  }
  if (env === "real") {
    const slv = body.sl_pips ? `SL ${body.sl_pips} pips` : "SL 空（guard 兜底）";
    const tpv = body.tp_price ? `TP @${body.tp_price}` : "TP 无";
    const msg = `⚠⚠ 真实资金下单确认 ⚠⚠\n${activeSymbol} ${isBuy ? "买入" : "卖出"} ` +
      `${amount}（${type === "market" ? "市价" : type + " @" + body.rate}）\n${slv} | ${tpv}\n确认执行？`;
    if (!confirm(msg)) return;
    body.confirm = true;
  }
  try {
    const r = await fetch(`/api/${env}/orders`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { alert(`下单失败: ${j.detail || r.status}`); return; }
    alert(`已提交: ${JSON.stringify(j)}`);
    loadPanel();
  } catch (e) { alert("下单异常: " + e); }
}

async function closePos(tradeId) {
  if (activeEnv === "real" &&
      !confirm(`⚠⚠ 真实资金平仓确认 ⚠⚠\n平仓 ${tradeId}\n确认执行？`)) return;
  const r = await fetch(`/api/${activeEnv}/positions/${tradeId}/close`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(activeEnv === "real" ? { confirm: true } : {}),
  });
  const j = await r.json();
  if (!r.ok) { alert(`平仓失败: ${j.detail || r.status}`); return; }
  loadPanel();
}

async function cancelOrder(orderId) {
  const r = await fetch(`/api/${activeEnv}/orders/${orderId}`, { method: "DELETE" });
  const j = await r.json();
  if (!r.ok) { alert(`撤单失败: ${j.detail || r.status}`); return; }
  loadPanel();
}

async function cancelTrigger(tid) {
  const r = await fetch(`/api/${activeEnv}/triggers/${tid}`, { method: "DELETE" });
  await r.json();
  loadPanel();
}

function onTypeChange() {
  const type = document.getElementById("t-type").value;
  const rateInput = document.getElementById("t-rate");
  rateInput.disabled = type === "market";
  if (type !== "market" && lastQuote && !rateInput.value) {
    const digits = DIGITS[activeSymbol] ?? 5;
    rateInput.value = (document.getElementById("t-side").value === "buy"
      ? lastQuote.ask : lastQuote.bid).toFixed(digits);
  }
  rateInput.placeholder = type === "market" ? "市价免填" : "必填";
}

async function loadConstraints() {
  document.getElementById("t-symbol").textContent = activeSymbol;
  try {
    const r = await fetch(`/api/${activeEnv}/trade-constraints?symbol=${encodeURIComponent(activeSymbol)}`);
    if (!r.ok) { document.getElementById("t-hint").textContent = ""; return; }
    const c = await r.json();
    constraintsData = c;
    document.getElementById("t-hint").textContent =
      `现价 ${c.price} · 最小交易单位 ${c.min_amount} · 名义最小 $${(c.min_amount * c.price).toFixed(0)} · ` +
      `安全手数 ≤${c.max_safe_amount}（保证金占用 <50%）`;
    updateSlHint();
  } catch { document.getElementById("t-hint").textContent = ""; }
}

function updateSlHint() {
  const el = document.getElementById("t-sl-hint");
  const sl = parseFloat(document.getElementById("t-sl").value);
  if (!constraintsData || !constraintsData.pip_size || !sl) {
    el.textContent = ""; el.className = "hint"; return;
  }
  const usd = sl * constraintsData.pip_size;
  const tight = constraintsData.min_stop_distance_pips > 0 &&
    sl < constraintsData.min_stop_distance_pips * 3;
  el.textContent = `≈ $${usd.toFixed(2)} 距现价` + (tight ? " ⚠ 过窄，可能秒止损" : "");
  el.className = "hint" + (tight ? " warn" : "");
}

function updateTpHint() {
  const el = document.getElementById("t-tp-hint");
  const tp = parseFloat(document.getElementById("t-tp").value);
  if (!constraintsData || !constraintsData.pip_size || !tp) {
    el.textContent = ""; el.className = "hint"; return;
  }
  const isBuy = document.getElementById("t-side").value === "buy";
  const cur = constraintsData.price;
  const dist = isBuy ? tp - cur : cur - tp;
  const wrong = isBuy ? tp <= cur : tp >= cur;
  el.textContent = wrong ? "⚠ 方向错误（多止盈>现价 / 空止盈<现价）"
    : `距现价 ${dist.toFixed(2)}（${Math.abs(dist / constraintsData.pip_size).toFixed(0)} pips）`;
  el.className = "hint" + (wrong ? " warn" : "");
}

function onLive(quote) {
  if (!quote || !series) return;
  renderQuote(quote);
  const price = quote.bid;
  const bucket = Math.floor(quote.ts / TFS[activeTf]) * TFS[activeTf] + TZ_OFFSET_H * 3600;
  if (!lastBar || bucket > lastBar.time) {
    lastBar = { time: bucket, open: price, high: price, low: price, close: price };
  } else {
    lastBar.high = Math.max(lastBar.high, price);
    lastBar.low = Math.min(lastBar.low, price);
    lastBar.close = price;
  }
  series.update(lastBar);
}

function connectWs() {
  if (ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket(`ws://${location.host}/ws?symbol=${encodeURIComponent(activeSymbol)}`);
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    onLive(msg.quotes && msg.quotes[activeSymbol]);
  };
}

async function checkHealth() {
  const el = document.getElementById("status");
  try {
    const r = await fetch("/api/environments");
    const envs = await r.json();
    const mine = envs[activeEnv];
    if (mine && mine.status === "CONNECTED") {
      el.textContent = `${activeEnv.toUpperCase()} 已连接`;
      el.className = "status ok";
    } else {
      el.textContent = `${activeEnv.toUpperCase()} ${mine ? mine.status : "N/A"}`;
      el.className = "status bad";
    }
  } catch { el.textContent = "服务不可达"; el.className = "status bad"; }
}

function switchEnv(env) {
  activeEnv = env;
  document.body.className = env === "real" ? "real-env" : "demo-env";
  document.getElementById("btn-demo").className = "env-btn" + (env === "demo" ? " active-demo" : "");
  document.getElementById("btn-real").className = "env-btn" + (env === "real" ? " active-real" : "");
  document.getElementById("env-banner").textContent = env === "real"
    ? "⚠ 真实资金环境（real 账户）— 所有操作影响真实资金"
    : "🧪 模拟环境（demo 账户）";
  loadConstraints();
  loadPanel();
  checkHealth();
}

async function loadPanel() {
  const acctRow = document.getElementById("acct-row");
  const tbody = document.getElementById("pos-body");
  try {
    const [envRes, posRes] = await Promise.all([
      fetch(`/api/environments`), fetch(`/api/${activeEnv}/positions`),
    ]);
    const envs = await envRes.json();
    const positions = await posRes.json();
    updateTradeOverlays(positions);
    const acct = envs[activeEnv] && envs[activeEnv].account;
    acctRow.innerHTML = acct
      ? `<span><span class="label">环境</span>${activeEnv.toUpperCase()}</span>` +
        `<span><span class="label">账户</span>${acct.account}</span>` +
        `<span><span class="label">余额</span>${acct.balance.toFixed(2)}</span>` +
        `<span><span class="label">净值</span>${acct.equity.toFixed(2)}</span>`
      : `<span style="color:var(--muted)">${activeEnv} 会话未就绪</span>`;
    tbody.innerHTML = !positions.length
      ? `<tr><td colspan="8" style="color:var(--muted)">无持仓</td></tr>`
      : positions.map(p => {
      const d = DIGITS[p.symbol] ?? 5;
      const plColor = p.gross_pl >= 0 ? "var(--up)" : "var(--down)";
      return `<tr><td>${p.trade_id}</td><td>${p.symbol}</td>` +
        `<td class="${p.is_buy ? "pos-buy" : "pos-sell"}">${p.is_buy ? "BUY" : "SELL"}</td>` +
        `<td>${p.amount}</td><td>${p.open_rate.toFixed(d)}</td>` +
        `<td>${p.stop ? p.stop.toFixed(d) : "无"}</td><td>${p.stop_order_id || "-"}</td>` +
        `<td style="color:${plColor}">${p.gross_pl.toFixed(2)}</td>` +
        `<td><button class="rowbtn" onclick="closePos('${p.trade_id}')">平仓</button></td></tr>`;
      }).join("");
    const pendRes = await fetch(`/api/${activeEnv}/orders`);
    const pend = await pendRes.json();
    const rows = [];
    (pend.orders || []).forEach(o => {
      rows.push(`<tr><td>${o.order_id}</td><td>${o.type}</td><td>${activeSymbol}</td>` +
        `<td class="${o.is_buy ? "pos-buy" : "pos-sell"}">${o.is_buy ? "BUY" : "SELL"}</td>` +
        `<td>${o.rate}</td><td>${o.amount}</td><td>等待触发</td>` +
        `<td><button class="rowbtn" onclick="cancelOrder('${o.order_id}')">撤销</button></td></tr>`);
    });
    (pend.triggers || []).forEach(t => {
      rows.push(`<tr><td>${t.trigger_id}</td><td>触发器</td><td>${t.symbol}</td>` +
        `<td class="${t.is_buy ? "pos-buy" : "pos-sell"}">${t.is_buy ? "BUY" : "SELL"}</td>` +
        `<td>${t.rate}</td><td>${t.amount}</td>` +
        `<td>band ${t.band_pips} pips</td>` +
        `<td><button class="rowbtn" onclick="cancelTrigger('${t.trigger_id}')">撤销</button></td></tr>`);
    });
    document.getElementById("pend-body").innerHTML = rows.length
      ? rows.join("") : `<tr><td colspan="8" style="color:var(--muted)">无</td></tr>`;
    const [statsRes, histRes] = await Promise.all([
      fetch(`/api/${activeEnv}/stats`), fetch(`/api/${activeEnv}/history/trades?limit=20`),
    ]);
    const st = await statsRes.json();
    const cards = [
      ["总PnL", st.total_pnl], ["已实现", st.realized_pnl], ["未实现", st.unrealized_pnl],
      ["胜率", (st.winrate * 100).toFixed(1) + "%"], ["夏普", st.sharpe_ratio],
      ["最大回撤", st.max_drawdown], ["盈亏比", st.max_profitloss_ratio == null ? "∞" : st.max_profitloss_ratio],
      ["连盈/连亏", `${st.max_consecutive_profit}/${st.max_consecutive_loss}`],
      ["交易次数", st.closed_trade_cnt], ["均持仓(分)", st.avg_holding_minutes],
      ["总滑点", st.total_slippage], ["总佣金", st.total_commission],
    ];
    document.getElementById("stats-row").innerHTML = cards.map(([k, v]) =>
      `<div class="stat-card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    const closed = await histRes.json();
    document.getElementById("closed-body").innerHTML = closed.length
      ? closed.map(t => {
          const d = DIGITS[t.symbol] ?? 5;
          const plColor = t.gross_pl >= 0 ? "var(--up)" : "var(--down)";
          const ct = t.close_time && t.close_time.strftime
            ? t.close_time.strftime("%m-%d %H:%M") : String(t.close_time ?? "");
          return `<tr><td>${t.trade_id}</td><td>${t.symbol}</td>` +
            `<td class="${t.is_buy ? "pos-buy" : "pos-sell"}">${t.is_buy ? "BUY" : "SELL"}</td>` +
            `<td>${t.open_rate.toFixed(d)}</td><td>${t.close_rate.toFixed(d)}</td>` +
            `<td style="color:${plColor}">${t.gross_pl.toFixed(2)}</td><td>${ct}</td></tr>`;
        }).join("")
      : `<tr><td colspan="7" style="color:var(--muted)">暂无已平仓记录</td></tr>`;
  } catch {
    tbody.innerHTML = `<tr><td colspan="8" style="color:var(--muted)">加载失败</td></tr>`;
  }
}

function buildTabs() {
  const symBox = document.getElementById("symbol-tabs");
  SYMBOLS.forEach(s => {
    const t = document.createElement("div");
    t.className = "tab" + (s === activeSymbol ? " active" : "");
    t.textContent = s;
    t.onclick = () => {
      if (activeSymbol === s) return;
      activeSymbol = s;
      document.getElementById("t-rate").value = "";
      loadConstraints();
      symBox.querySelectorAll(".tab").forEach(e => e.classList.toggle("active", e.textContent === s));
      loadCandles().then(connectWs);
    };
    symBox.appendChild(t);
  });
  const tfBox = document.getElementById("tf-tabs");
  Object.keys(TFS).forEach(tf => {
    const t = document.createElement("div");
    t.className = "tab" + (tf === activeTf ? " active" : "");
    t.textContent = tf;
    t.onclick = () => {
      if (activeTf === tf) return;
      activeTf = tf;
      tfBox.querySelectorAll(".tab").forEach(e => e.classList.toggle("active", e.textContent === tf));
      loadCandles();
    };
    tfBox.appendChild(t);
  });
}

(async function init() {
  buildTabs();
  document.getElementById("csv-note").textContent =
    "数据来源：real 行情（OFFERS 实时 + SQLite 历史回填）· 周期 1m/15m/1h/4h · 图表两环境共用 real 数据";
  document.getElementById("t-type").onchange = onTypeChange;
  document.getElementById("t-side").onchange = () => { onTypeChange(); updateTpHint(); };
  loadConstraints();
  await loadCandles();
  connectWs();
  loadPanel();
  checkHealth();
  setInterval(checkHealth, 5000);
  setInterval(loadPanel, 3000);
})();
</script>
